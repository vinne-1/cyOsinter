name: CI

# Runs on every push to main and every PR:
#   verify   - TypeScript + 679 unit tests
#   e2e      - Playwright against a real Postgres
#   security - npm audit (high/critical block) + dependency review
#   codeql   - static analysis, security-extended queries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: TypeScript + Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyoshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyoshield_test
      SESSION_SECRET: test-session-secret-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Push DB schema
        run: npm run db:push

      - name: Unit tests
        run: npm test

      - name: Upload coverage (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyoshield_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyoshield_e2e
      SESSION_SECRET: test-session-secret-e2e
      NODE_ENV: test
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Push DB schema + seed
        run: npm run db:push

      - name: Run E2E tests
        run: npx playwright test --reporter=list,github

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ── Supply chain ────────────────────────────────────────────────────────────
  # A security product that never audits its own dependencies is a bad look, and
  # this repo had 23 advisories (11 high) before anyone looked.
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails the build on HIGH or CRITICAL only. Moderate advisories are
      # reported but do not block: three of them are currently only fixable by a
      # major upgrade of drizzle-orm/exceljs, and a permanently-red pipeline
      # teaches people to ignore it.
      - name: npm audit (high and critical block the build)
        run: npm audit --audit-level=high

      - name: npm audit (full report, advisory only)
        if: always()
        run: npm audit || true

      # Flags a dependency added in a PR that carries a known advisory, before
      # it lands rather than after.
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── Static analysis ─────────────────────────────────────────────────────────
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds the injection and SSRF queries, which are the
          # ones that matter for a scanner making outbound requests to
          # user-supplied targets.
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@v3
