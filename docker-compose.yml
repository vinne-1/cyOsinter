services:
  db:
    image: postgres:16
    container_name: cyshield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cyshield}
    # Host 5433 (not 5432) avoids clashing with a local Postgres; the app talks
    # to the DB over the internal network as db:5432 regardless.
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - cyshield_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    container_name: cyshield-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    image: cybershield-pro:latest
    container_name: cyshield-app
    restart: unless-stopped
    # Access the product at http://localhost:5050  (container listens on 5000).
    ports:
      - "${APP_HOST_PORT:-5050}:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cyshield}
      PORT: 5000
      NODE_ENV: production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-0}
      # Turnkey login seeded on first run (change these, or set via .env).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@cyshield.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Probe readiness, not the SPA: hitting / returns 200 even when the
      # database is down, so the container would report healthy while broken.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Optional: put ABUSEIPDB_API_KEY / VIRUSTOTAL_API_KEY / TAVILY_API_KEY /
    # NVD_API_KEY (and overrides for the vars above) in a .env file, then
    # uncomment the next two lines to load them.
    # env_file:
    #   - .env

volumes:
  cyshield_db_data:
  ollama_data:
